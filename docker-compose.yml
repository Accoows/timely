services:
  db:
    image: postgres:15-alpine
    container_name: timely_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: timely_backend
    command: sh /app/start.sh
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: timely_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8000

  adminer:
    image: adminer:latest
    container_name: timely_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: