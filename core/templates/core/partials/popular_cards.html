{% load static %}
{% for est in establishments %}
    <div class="popular-card group">
        <div class="popular-card-image-wrapper">
            <img src="{% static est.image %}" alt="{{ est.name }}" class="popular-card-image" />
            <span class="popular-card-badge">{{ est.badge }}</span>
        </div>
        <div class="popular-card-info">
            <div>
                <h3 class="popular-card-name">{{ est.name }}</h3>
                <p class="popular-card-address">{{ est.address }}</p>
            </div>
            <div class="popular-card-rating">
                <svg xmlns="http://www.w3.org/2000/svg" class="popular-card-rating-icon" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>
                <span class="popular-card-rating-text">{{ est.rating }}</span>
            </div>
        </div>
    </div>
{% empty %}
    <div class="col-span-full py-12 text-center text-neutral-500">
        Aucun établissement trouvé dans cette catégorie.
    </div>
{% endfor %}
