name: Continuous Integration (CI)

on:
  push:
    branches:
      - '**' # Déclenche la CI sur n'importe quelle branche poussée
  pull_request:
    branches:
      - '**' # Déclenche la CI sur n'importe quelle PR

jobs:
  # 1. Vérification et compilation du Frontend
  frontend-check:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Check (TypeScript & Bundling)
        run: |
          cd frontend
          npm run build

  # 2. Vérification et tests du Backend Django
  backend-check:
    name: Backend (Django & PostgreSQL)
    runs-on: ubuntu-latest

    # Service de base de données PostgreSQL pour pouvoir tester le code Django
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: timely_db
          POSTGRES_USER: timely_user
          POSTGRES_PASSWORD: AZEqsd123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django Configuration Check
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-secret-key-for-django-check-and-tests-runs'
          POSTGRES_DB: timely_db
          POSTGRES_USER: timely_user
          POSTGRES_PASSWORD: AZEqsd123!
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python backend/manage.py check

      - name: Run Django Tests
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-secret-key-for-django-check-and-tests-runs'
          POSTGRES_DB: timely_db
          POSTGRES_USER: timely_user
          POSTGRES_PASSWORD: AZEqsd123!
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python backend/manage.py test
